name: Parcel Dispatch · measured workers and shards
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  COMMANDBOX_HOME: ${{ github.workspace }}/.runtime/commandbox
  BOXLANG_HOME: ${{ github.workspace }}/.runtime/tooling
  BOXLANG_JAR_PATH: ${{ github.workspace }}/.deps/boxlang-runtime/boxlang-1.18.0.jar
  BOX_SERVER_JVM_JAVAHOME: ${{ github.workspace }}/.runtime/commandbox/serverJREs/openjdk21_jre_x64_linux_hotspot_jdk-21.0.12.1+1
permissions:
  contents: read
  actions: read
concurrency:
  group: worker-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/prepare
      - name: Verify BoxLang-only authored source
        run: box run-script audit
      - name: Start loopback application
        run: |
          box server start --noSaveSettings
          box run-script ready
      - name: Quick native CLI correctness and real failure preservation
        run: box run-script ci:quick
      - name: Quick browser comparison and long native RUN
        run: |
          box run-script browser:setup
          box run-script browser:test
          box run-script browser:long
      - name: Stop owned server
        if: always()
        run: box server stop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: worker-and-browser-evidence
          path: results/
          if-no-files-found: error
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [serial, parallel-4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/prepare
      - name: Measure long CommandBox and server lifecycle
        run: box boxlang cli scripts/lab.bxs measure-case ${{ matrix.mode }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: timing-${{ matrix.mode }}
          path: results/measurements/${{ matrix.mode }}-timing.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: comparison-${{ matrix.mode }}-report
          path: results/measurements/${{ matrix.mode }}.json
          if-no-files-found: error
  shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/prepare
      - name: Measure assigned long shard and lifecycle
        run: box boxlang cli scripts/lab.bxs measure-case shard-${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: testbox-shard-${{ matrix.shard }}
          path: results/measurements/shard-${{ matrix.shard }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: timing-shard-${{ matrix.shard }}
          path: results/measurements/shard-${{ matrix.shard }}-timing.json
          if-no-files-found: error
  merge:
    needs: shards
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/prepare
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: testbox-shard-*
          path: results/shards
          merge-multiple: true
      - name: Native CLI merge, exact coverage and rejection safeguards
        run: box run-script ci:merge
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: testbox-combined
          path: results/combined.json
          if-no-files-found: error
  summary:
    needs: [comparison, merge, workers]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/prepare
        with:
          summary-only: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: timing-*
          path: results/ci-input
      - name: Compare real full hosted job and shard-path boundaries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: ci/summary
        run: box boxlang cli ../../scripts/summary.bxs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: timing-comparison
          path: results/comparison/
          if-no-files-found: error
