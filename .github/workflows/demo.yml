name: Parcel Dispatch · workers and shards
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # release pin
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # release pin
        with:
          distribution: temurin
          java-version: "21.0.10"
      - name: Bootstrap pinned BoxLang runtime
        run: |
          mkdir -p .bootstrap
          curl --fail --location --retry 3 https://downloads.ortussolutions.com/ortussolutions/boxlang/1.18.0/boxlang-1.18.0.jar --output .bootstrap/boxlang.jar
          echo "f9908fc0f2b699e8ed28c577b25bbf475f17dc14181bea1cf7f3672126f40379  .bootstrap/boxlang.jar" | sha256sum --check
      - name: Fetch pinned dependencies
        run: java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs setup
      - name: Verify BoxLang-only authored source
        run: java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs audit
      - name: Start loopback application
        run: |
          java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs start
          java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs wait-ready
      - name: Real failure preservation contract
        run: java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs contracts
      - name: Standard serial runner
        run: |
          java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs cli testbox run runner=serial outputFile=results/serial.json
          java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs verify-report results/serial.json
      - name: Two isolated JVMs
        run: |
          java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs cli testbox run runner=parallel workers=2 interactive=false outputFile=results/parallel-2.json
          java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs verify-report results/parallel-2.json
      - name: Four isolated JVMs
        run: |
          java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs cli testbox run runner=parallel workers=4 interactive=false outputFile=results/parallel-4.json
          java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs verify-report results/parallel-4.json
      - name: Browser comparison and native RUN
        run: |
          java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs browser-setup
          java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs browser
      - name: Stop owned server
        if: always()
        run: java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs stop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # release pin
        if: always()
        with:
          name: worker-and-browser-evidence
          path: results/
          if-no-files-found: error
  shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21.0.10"
      - name: Bootstrap pinned BoxLang runtime
        run: |
          mkdir -p .bootstrap
          curl --fail --location --retry 3 https://downloads.ortussolutions.com/ortussolutions/boxlang/1.18.0/boxlang-1.18.0.jar --output .bootstrap/boxlang.jar
          echo "f9908fc0f2b699e8ed28c577b25bbf475f17dc14181bea1cf7f3672126f40379  .bootstrap/boxlang.jar" | sha256sum --check
      - run: java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs setup
      - name: Start loopback application
        run: |
          java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs start
          java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs wait-ready
      - name: Execute assigned bundles
        run: >-
          java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs cli testbox run runner=serial shard=${{ matrix.shard }}/4
          shardRunId=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          outputFile=results/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: testbox-shard-${{ matrix.shard }}
          path: results/shard-${{ matrix.shard }}.json
          if-no-files-found: error
      - name: Stop owned server
        if: always()
        run: java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs stop
  merge:
    needs: shards
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21.0.10"
      - name: Bootstrap pinned BoxLang runtime
        run: |
          mkdir -p .bootstrap
          curl --fail --location --retry 3 https://downloads.ortussolutions.com/ortussolutions/boxlang/1.18.0/boxlang-1.18.0.jar --output .bootstrap/boxlang.jar
          echo "f9908fc0f2b699e8ed28c577b25bbf475f17dc14181bea1cf7f3672126f40379  .bootstrap/boxlang.jar" | sha256sum --check
      - run: java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: testbox-shard-*
          path: results/shards
          merge-multiple: true
      - name: Verify full suite coverage and merge
        run: |
          java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs cli testbox merge directory=results/shards outputFile=results/combined.json
          java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs verify-report results/combined.json
          java -jar .bootstrap/boxlang.jar --bx-home .runtime/tooling scripts/lab.bxs verify-merge
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: testbox-combined
          path: results/combined.json
          if-no-files-found: error
