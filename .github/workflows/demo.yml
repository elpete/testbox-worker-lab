name: Parcel Dispatch · workers and shards
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21.0.10"
      - name: Fetch pinned dependencies
        run: python3 scripts/setup.py
      - name: Start loopback application
        run: |
          scripts/box server start javaHome="$JAVA_HOME"
          python3 scripts/wait-ready.py
      - name: Real failure preservation contract
        run: scripts/test-contracts
      - name: Standard serial runner
        run: |
          scripts/box testbox run runner=serial outputFile=results/serial.json
          python3 scripts/check-results.py results/serial.json
      - name: Two isolated JVMs
        run: |
          scripts/box testbox run runner=parallel workers=2 interactive=false outputFile=results/parallel-2.json
          python3 scripts/check-results.py results/parallel-2.json
      - name: Four isolated JVMs
        run: |
          scripts/box testbox run runner=parallel workers=4 interactive=false outputFile=results/parallel-4.json
          python3 scripts/check-results.py results/parallel-4.json
      - name: Browser comparison and native RUN
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Stop owned server
        if: always()
        run: scripts/box server stop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: worker-and-browser-evidence
          path: results/
          if-no-files-found: error
  shards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21.0.10"
      - run: python3 scripts/setup.py
      - name: Start loopback application
        run: |
          scripts/box server start javaHome="$JAVA_HOME"
          python3 scripts/wait-ready.py
      - name: Execute assigned bundles
        run: >-
          scripts/box testbox run runner=serial shard=${{ matrix.shard }}/4
          shardRunId=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          outputFile=results/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: testbox-shard-${{ matrix.shard }}
          path: results/shard-${{ matrix.shard }}.json
          if-no-files-found: error
      - name: Stop owned server
        if: always()
        run: scripts/box server stop
  merge:
    needs: shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21.0.10"
      - run: python3 scripts/setup.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: testbox-shard-*
          path: results/shards
          merge-multiple: true
      - name: Verify full suite coverage and merge
        run: |
          scripts/box testbox merge directory=results/shards outputFile=results/combined.json
          python3 scripts/check-results.py results/combined.json
          python3 scripts/verify-merge.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: testbox-combined
          path: results/combined.json
          if-no-files-found: error
