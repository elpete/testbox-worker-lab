name: Parcel Dispatch · measured workers and shards
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  COMMANDBOX_HOME: ${{ github.workspace }}/.runtime/commandbox
  BOXLANG_HOME: ${{ github.workspace }}/.runtime/tooling
permissions:
  contents: read
  actions: read
concurrency:
  group: worker-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21.0.10"
      - uses: Ortus-Solutions/setup-commandbox@157ba183d42a6f1abfcbaa4c303072f95837f417
        with:
          version: "6.3.5"
      - name: Prepare isolated CommandBox home
        run: mkdir -p "$COMMANDBOX_HOME"
      - name: Install pinned dependencies
        run: box install
      - name: Verify and wire pinned dependencies
        run: box run-script setup
      - name: Verify BoxLang-only authored source
        run: box run-script audit
      - name: Start loopback application
        run: |
          box server start --noSaveSettings
          box run-script ready
      - name: Real failure preservation contract
        run: box run-script contracts
      - name: Quick serial and worker correctness
        run: |
          box testbox run runner=serial options:demoDelayMs=300 outputFile=results/serial.json
          box run-script verify:serial
          box testbox run runner=parallel workers=2 options:demoDelayMs=300 interactive=false outputFile=results/parallel-2.json
          box run-script verify:two
          box testbox run runner=parallel workers=4 options:demoDelayMs=300 interactive=false outputFile=results/parallel-4.json
          box run-script verify:four
      - name: Quick browser comparison and long native RUN
        run: |
          box run-script browser:setup
          box run-script browser:test
          box run-script browser:long
      - name: Stop owned server
        if: always()
        run: box server stop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: worker-and-browser-evidence
          path: results/
          if-no-files-found: error
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [serial, parallel-4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21.0.10"
      - uses: Ortus-Solutions/setup-commandbox@157ba183d42a6f1abfcbaa4c303072f95837f417
        with:
          version: "6.3.5"
      - name: Prepare isolated CommandBox home
        run: mkdir -p "$COMMANDBOX_HOME"
      - name: Install pinned dependencies
        run: box install
      - name: Verify and wire pinned dependencies
        run: box run-script setup
      - name: Measure long CommandBox and server lifecycle
        run: box boxlang cli scripts/lab.bxs measure-case ${{ matrix.mode }}
      - name: Stop owned server
        if: always()
        run: box server stop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: timing-${{ matrix.mode }}
          path: results/measurements/${{ matrix.mode }}-timing.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: comparison-${{ matrix.mode }}-report
          path: results/measurements/${{ matrix.mode }}.json
          if-no-files-found: error
  shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21.0.10"
      - uses: Ortus-Solutions/setup-commandbox@157ba183d42a6f1abfcbaa4c303072f95837f417
        with:
          version: "6.3.5"
      - name: Prepare isolated CommandBox home
        run: mkdir -p "$COMMANDBOX_HOME"
      - name: Install pinned dependencies
        run: box install
      - name: Verify and wire pinned dependencies
        run: box run-script setup
      - name: Measure assigned long shard and lifecycle
        run: box boxlang cli scripts/lab.bxs measure-case shard-${{ matrix.shard }}
      - name: Stop owned server
        if: always()
        run: box server stop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: testbox-shard-${{ matrix.shard }}
          path: results/measurements/shard-${{ matrix.shard }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: timing-shard-${{ matrix.shard }}
          path: results/measurements/shard-${{ matrix.shard }}-timing.json
          if-no-files-found: error
  merge:
    needs: shards
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21.0.10"
      - uses: Ortus-Solutions/setup-commandbox@157ba183d42a6f1abfcbaa4c303072f95837f417
        with:
          version: "6.3.5"
      - name: Prepare isolated CommandBox home
        run: mkdir -p "$COMMANDBOX_HOME"
      - name: Install pinned dependencies
        run: box install
      - name: Verify and wire pinned dependencies
        run: box run-script setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: testbox-shard-*
          path: results/shards
          merge-multiple: true
      - name: Verify full suite coverage and merge
        run: |
          box testbox merge directory=results/shards outputFile=results/combined.json
          box run-script verify:combined
          box run-script verify:merge
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: testbox-combined
          path: results/combined.json
          if-no-files-found: error
  summary:
    needs: [comparison, merge, workers]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21.0.10"
      - uses: Ortus-Solutions/setup-commandbox@157ba183d42a6f1abfcbaa4c303072f95837f417
        with:
          version: "6.3.5"
      - name: Prepare isolated CommandBox home
        run: mkdir -p "$COMMANDBOX_HOME"
      - name: Install pinned dependencies
        run: box install
      - name: Verify and wire pinned dependencies
        run: box run-script setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: timing-*
          path: results/ci-input
      - name: Compare real full hosted job and shard-path boundaries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: box run-script ci:summary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: timing-comparison
          path: results/comparison/
          if-no-files-found: error
