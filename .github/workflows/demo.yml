name: Parcel Dispatch · workers and shards
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  COMMANDBOX_HOME: ${{ github.workspace }}/.runtime/commandbox
  BOXLANG_HOME: ${{ github.workspace }}/.runtime/tooling
permissions:
  contents: read
concurrency:
  group: worker-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # release pin
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # release pin
        with:
          distribution: temurin
          java-version: "21.0.10"
      - uses: Ortus-Solutions/setup-commandbox@157ba183d42a6f1abfcbaa4c303072f95837f417
        with:
          version: "6.3.5"
      - name: Prepare isolated CommandBox home
        run: mkdir -p "$COMMANDBOX_HOME"
      - name: Install pinned dependencies
        run: box install
      - name: Verify and wire pinned dependencies
        run: box run-script setup
      - name: Verify BoxLang-only authored source
        run: box run-script audit
      - name: Start loopback application
        run: |
          box server start --noSaveSettings
          box run-script ready
      - name: Real failure preservation contract
        run: box run-script contracts
      - name: Standard serial runner
        run: |
          box testbox run runner=serial outputFile=results/serial.json
          box run-script verify:serial
      - name: Two isolated JVMs
        run: |
          box testbox run runner=parallel workers=2 interactive=false outputFile=results/parallel-2.json
          box run-script verify:two
      - name: Four isolated JVMs
        run: |
          box testbox run runner=parallel workers=4 interactive=false outputFile=results/parallel-4.json
          box run-script verify:four
      - name: Browser comparison and native RUN
        run: |
          box run-script browser:setup
          box run-script browser:test
      - name: Stop owned server
        if: always()
        run: box server stop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # release pin
        if: always()
        with:
          name: worker-and-browser-evidence
          path: results/
          if-no-files-found: error
  shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21.0.10"
      - uses: Ortus-Solutions/setup-commandbox@157ba183d42a6f1abfcbaa4c303072f95837f417
        with:
          version: "6.3.5"
      - name: Prepare isolated CommandBox home
        run: mkdir -p "$COMMANDBOX_HOME"
      - name: Install pinned dependencies
        run: box install
      - run: box run-script setup
      - name: Start loopback application
        run: |
          box server start --noSaveSettings
          box run-script ready
      - name: Execute assigned bundles
        run: >-
          box testbox run runner=serial shard=${{ matrix.shard }}/4
          shardRunId=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          outputFile=results/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: testbox-shard-${{ matrix.shard }}
          path: results/shard-${{ matrix.shard }}.json
          if-no-files-found: error
      - name: Stop owned server
        if: always()
        run: box server stop
  merge:
    needs: shards
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21.0.10"
      - uses: Ortus-Solutions/setup-commandbox@157ba183d42a6f1abfcbaa4c303072f95837f417
        with:
          version: "6.3.5"
      - name: Prepare isolated CommandBox home
        run: mkdir -p "$COMMANDBOX_HOME"
      - name: Install pinned dependencies
        run: box install
      - run: box run-script setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: testbox-shard-*
          path: results/shards
          merge-multiple: true
      - name: Verify full suite coverage and merge
        run: |
          box testbox merge directory=results/shards outputFile=results/combined.json
          box run-script verify:combined
          box run-script verify:merge
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: testbox-combined
          path: results/combined.json
          if-no-files-found: error
